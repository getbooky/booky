version: "2"

run:
  timeout: 5m

linters:
  enable:
    - govet
    - staticcheck
    - errcheck
    - ineffassign
    - unused
    - gosec
    - misspell
  settings:
    errcheck:
      # deferred/best-effort closes and removes follow the usual Go idiom;
      # writes and commits are always checked
      exclude-functions:
        - (io.Closer).Close
        - (io.ReadCloser).Close
        - (io/fs.File).Close
        - (*os.File).Close
        - (*database/sql.DB).Close
        - (*database/sql.Rows).Close
        - (*archive/zip.ReadCloser).Close
        - (*archive/zip.Writer).Close
        - os.Remove
        - fmt.Fprint
    gosec:
      excludes:
        - G304 # file paths are constructed internally; revisit per-call as I/O features land
        - G301 # 0755 dirs are the media-server convention; UMASK controls the final bits
        - G104 # unchecked errors are errcheck's job, with its exclusion list
